# InboxRL: GRPO configuration for 8 GB+ GPUs (desktop RTX, Kaggle T4 16 GB).
base: configs/grpo_qwen05b_4gb.yaml

num_generations: 8              # bigger groups -> better advantage estimates
per_device_train_batch_size: 8
gradient_accumulation_steps: 4  # 4 prompts x 8 generations per step
gradient_checkpointing: false
